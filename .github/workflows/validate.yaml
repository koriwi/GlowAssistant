name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (HA 2026.4.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r requirements-ha-test.txt ruff
      - name: Install HA conversation dependencies
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from importlib.util import find_spec
          from pathlib import Path

          ha_path = Path(find_spec("homeassistant").origin).parent
          requirements = []
          for domain in ("conversation", "intent"):
              manifest = json.loads((ha_path / "components" / domain / "manifest.json").read_text())
              requirements.extend(manifest.get("requirements", []))
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *dict.fromkeys(requirements)])
          PY
      - run: python -m unittest -v
      - run: ruff check --select E4,E7,E9,F,I custom_components local.py benchmark.py test_benchmark.py test_snapshot_api.py test_integration_engine.py test_integration_client.py test_ha_integration.py test_ha_context.py test_chat_log_trace.py test_general.py test_history.py test_mcp_tools.py test_text_values.py test_optional_parameters.py test_action_targets.py test_parameter_values.py test_programmatic_answers.py test_actions.py test_run_logs.py
  hassfest:
    name: hassfest (HA 2026.4.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: '2026.4.2'
          path: .hassfest-core
          persist-credentials: false
      - name: Build hassfest for HA 2026.4.2
        run: docker build --tag glow-hassfest:2026.4.2 --file .hassfest-core/script/hassfest/docker/Dockerfile .hassfest-core
      - name: Validate integration
        run: docker run --rm -v "${GITHUB_WORKSPACE}/custom_components:/github/workspace/custom_components" glow-hassfest:2026.4.2
